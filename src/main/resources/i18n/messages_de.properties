block.desc.AND=Logisches UND aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.OR=Logisches ODER aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.XOR=Logisches Exklusiv-ODER aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.NOT=Logische Negation. IEC-61131-3-Standardbaustein.
block.desc.GT=Monoton fallender Vergleich: IN1 > IN2 > ... IEC-61131-3-Standardbaustein.
block.desc.GE=IN1 >= IN2 >= ... IEC-61131-3-Standardbaustein.
block.desc.EQ=IN1 = IN2 = ... IEC-61131-3-Standardbaustein.
block.desc.NE=IN1 <> IN2. IEC-61131-3-Standardbaustein.
block.desc.LE=IN1 <= IN2 <= ... IEC-61131-3-Standardbaustein.
block.desc.LT=IN1 < IN2 < ... IEC-61131-3-Standardbaustein.
block.desc.ADD=Summe aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.SUB=IN1 - IN2. IEC-61131-3-Standardbaustein.
block.desc.MUL=Produkt aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.DIV=IN1 / IN2. IEC-61131-3-Standardbaustein.
block.desc.MOD=Rest von IN1 / IN2. IEC-61131-3-Standardbaustein.
block.desc.MOVE=Gibt IN unverändert an Q weiter. IEC-61131-3-Standardbaustein.
block.desc.SEL=Binäre Auswahl: Q = G ? IN1 : IN0. IEC-61131-3-Standardbaustein.
block.desc.MUX=Multiplexer: Q = INk, wobei k der nullbasierte Index K ist. IEC-61131-3-Standardbaustein.
block.desc.LIMIT=Begrenzt IN auf den Bereich zwischen MN und MX. IEC-61131-3-Standardbaustein.
block.desc.MAX=Größter Wert aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.MIN=Kleinster Wert aller Eingänge. IEC-61131-3-Standardbaustein.
block.desc.SR=Setzdominantes Flipflop: Sind S1 und R beide TRUE, wird Q1 TRUE. IEC-61131-3-Standardbaustein.
block.desc.RS=Rücksetzdominantes Flipflop: Sind S und R1 beide TRUE, wird Q1 FALSE. IEC-61131-3-Standardbaustein.
block.desc.R_TRIG=Erkennung der steigenden Flanke: Q ist für einen Zyklus TRUE, wenn CLK von FALSE auf TRUE wechselt. IEC-61131-3-Standardbaustein.
block.desc.F_TRIG=Erkennung der fallenden Flanke: Q ist für einen Zyklus TRUE, wenn CLK von TRUE auf FALSE wechselt. IEC-61131-3-Standardbaustein.
block.desc.TON=Ausgang Q wird PT nach dem Wechsel von IN auf TRUE gesetzt (setzt sofort zurück, wenn IN auf FALSE wechselt). IEC-61131-3-Standardbaustein.
block.desc.TOF=Ausgang Q bleibt PT lang TRUE, nachdem IN auf FALSE gewechselt ist. IEC-61131-3-Standardbaustein.
block.desc.TP=Erzeugt einen einzelnen Impuls fester Dauer PT, wenn IN auf TRUE wechselt. IEC-61131-3-Standardbaustein.
block.desc.CTU=Zählt bei jeder steigenden Flanke von CU aufwärts bis PV; Q wird TRUE, wenn CV >= PV. IEC-61131-3-Standardbaustein.
block.desc.CTD=Zählt bei jeder steigenden Flanke von CD abwärts von PV bis 0; Q wird TRUE, wenn CV <= 0. IEC-61131-3-Standardbaustein.
block.desc.CTUD=Bidirektionaler Zähler mit getrennten Takten für Auf- und Abwärtszählung. IEC-61131-3-Standardbaustein.
block.desc.PID=Proportional-Integral-Differential-Regelkreis. Häufige herstellerspezifische Erweiterung (nicht Teil des IEC-61131-3-Kernstandards, wird aber von fast allen SPS-Herstellern bereitgestellt).
block.desc.SCALE=Skaliert IN linear vom Bereich [INMIN, INMAX] in den Bereich [OUTMIN, OUTMAX]. Häufige herstellerspezifische Erweiterung.
block.desc.HYSTERESIS=Zweipunkt-Hysterese-/Schaltkomparator für Ein-/Aus-Regelkreise. Häufige herstellerspezifische Erweiterung.

example.logic_basics.title=Logik-Grundlagen
example.logic_basics.description=AND/OR/NOT-Grundlagen: eine Motorlauffreigabe, verriegelt mit einer Schutztür und einem invertierten Not-Aus.
example.blinking_alarm.title=Blinkender Alarm (TP)
example.blinking_alarm.description=Ein TP-Impulstimer, der über ein rückgekoppeltes NOT sich selbst erneut auslöst und BEACON alle 500ms ein-/ausschaltet, solange ALARM_ACTIVE TRUE ist.
example.conveyor_interlock.title=Förderband Start/Stopp-Verriegelung
example.conveyor_interlock.description=START_PB setzt ein SR-Flipflop, STOP_PB oder E_STOP (über ein ODER) setzt es zurück; CONVEYOR_RUN folgt dem Flipflop.
example.batch_counter.title=Chargenzähler (CTU)
example.batch_counter.description=Zählt PART_SENSOR-Impulse mit einem CTU-Baustein; BATCH_FULL wird TRUE, sobald PART_COUNT den Vorgabewert 10 erreicht.
example.tank_hysteresis.title=Tankfüllstand-Hysterese-Regelung
example.tank_hysteresis.description=FILL_PUMP_ON schaltet unter 20% und über 80% von TANK_LEVEL wieder aus, mittels HYSTERESIS-Baustein zur Vermeidung von Pumpenflattern.
example.pid_temperature.title=PID-Temperaturregelung
example.pid_temperature.description=Ein PID-Baustein steuert HEATER_OUTPUT (0-100%), um TEMP_PV auf TEMP_SETPOINT zu bringen.
example.seatbelt_warning.title=Sicherheitsgurt-Warnkette
example.seatbelt_warning.description=CHIME ertönt, wenn IGNITION_ON 5 Sekunden lang TRUE bleibt, während SEATBELT_FASTENED FALSE ist.
example.two_pump_alternation.title=Zweipumpen-Wechselstation
example.two_pump_alternation.description=Jeder START_CYCLE-Impuls erhöht einen Mod-2-Zähler, sodass PUMP1_RUN und PUMP2_RUN bei aufeinanderfolgenden Zyklen wechseln.
example.debounce_circuit.title=Schalter-Entprellschaltung
example.debounce_circuit.description=RAW_SWITCH muss 50ms lang TRUE bleiben, bevor DEBOUNCED folgt — filtert Kontaktprellen heraus.
example.parking_garage_counter.title=Parkhaus-Fahrzeugzähler
example.parking_garage_counter.description=CTUD erhöht sich bei CAR_ENTER und verringert sich bei CAR_EXIT; LOT_FULL leuchtet, sobald die Kapazität (50) erreicht ist.
example.emergency_stop_chain.title=Not-Aus-Kette
example.emergency_stop_chain.description=Jede der drei Not-Aus-Stationen löst ein rücksetzdominantes RS-Flipflop aus; PLANT_SAFE_TO_RUN kehrt erst nach RESET_ACK und dem Lösen aller Stopps zurück.
example.star_delta_start.title=Stern-Dreieck-Motorstartsequenz
example.star_delta_start.description=START_PB/STOP_PB verriegeln MAIN_CONTACTOR; STAR_CONTACTOR läuft 3s, dann übernimmt DELTA_CONTACTOR.
