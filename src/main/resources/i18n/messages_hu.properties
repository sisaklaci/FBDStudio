block.desc.AND=Az összes bemenet logikai ÉS kapcsolata. IEC 61131-3 szabványos blokk.
block.desc.OR=Az összes bemenet logikai VAGY kapcsolata. IEC 61131-3 szabványos blokk.
block.desc.XOR=Az összes bemenet logikai KIZÁRÓ VAGY kapcsolata. IEC 61131-3 szabványos blokk.
block.desc.NOT=Logikai negálás. IEC 61131-3 szabványos blokk.
block.desc.GT=Monoton csökkenő összehasonlítás: IN1 > IN2 > ... IEC 61131-3 szabványos blokk.
block.desc.GE=IN1 >= IN2 >= ... IEC 61131-3 szabványos blokk.
block.desc.EQ=IN1 = IN2 = ... IEC 61131-3 szabványos blokk.
block.desc.NE=IN1 <> IN2. IEC 61131-3 szabványos blokk.
block.desc.LE=IN1 <= IN2 <= ... IEC 61131-3 szabványos blokk.
block.desc.LT=IN1 < IN2 < ... IEC 61131-3 szabványos blokk.
block.desc.ADD=Az összes bemenet összege. IEC 61131-3 szabványos blokk.
block.desc.SUB=IN1 - IN2. IEC 61131-3 szabványos blokk.
block.desc.MUL=Az összes bemenet szorzata. IEC 61131-3 szabványos blokk.
block.desc.DIV=IN1 / IN2. IEC 61131-3 szabványos blokk.
block.desc.MOD=IN1 / IN2 osztás maradéka. IEC 61131-3 szabványos blokk.
block.desc.MOVE=Az IN értékét változatlanul továbbadja a Q kimenetre. IEC 61131-3 szabványos blokk.
block.desc.SEL=Bináris kiválasztás: Q = G ? IN1 : IN0. IEC 61131-3 szabványos blokk.
block.desc.MUX=Multiplexer: Q = INk, ahol k a 0-tól induló K index. IEC 61131-3 szabványos blokk.
block.desc.LIMIT=Az IN értékét MN és MX közé szorítja. IEC 61131-3 szabványos blokk.
block.desc.MAX=Az összes bemenet közül a legnagyobb. IEC 61131-3 szabványos blokk.
block.desc.MIN=Az összes bemenet közül a legkisebb. IEC 61131-3 szabványos blokk.
block.desc.SR=Set-domináns tároló (bistabil): ha S1 és R is TRUE, Q1 TRUE lesz. IEC 61131-3 szabványos blokk.
block.desc.RS=Reset-domináns tároló (bistabil): ha S és R1 is TRUE, Q1 FALSE lesz. IEC 61131-3 szabványos blokk.
block.desc.R_TRIG=Felfutó él detektor: a Q egy ciklusra TRUE lesz, amikor a CLK FALSE-ból TRUE-ba vált. IEC 61131-3 szabványos blokk.
block.desc.F_TRIG=Lefutó él detektor: a Q egy ciklusra TRUE lesz, amikor a CLK TRUE-ból FALSE-ba vált. IEC 61131-3 szabványos blokk.
block.desc.TON=A Q kimenet PT idővel azután válik TRUE-vá, hogy az IN TRUE lett (az IN FALSE-ra váltásakor azonnal visszaáll). IEC 61131-3 szabványos blokk.
block.desc.TOF=A Q kimenet PT ideig TRUE marad azután, hogy az IN FALSE-ra váltott. IEC 61131-3 szabványos blokk.
block.desc.TP=Egyetlen, PT hosszúságú rögzített impulzust generál, amikor az IN TRUE lesz. IEC 61131-3 szabványos blokk.
block.desc.CTU=A CU minden felfutó élére felfelé számol, amíg eléri a PV-t; a Q TRUE lesz, amikor CV >= PV. IEC 61131-3 szabványos blokk.
block.desc.CTD=A CD minden felfutó élére lefelé számol PV-től 0-ig; a Q TRUE lesz, amikor CV <= 0. IEC 61131-3 szabványos blokk.
block.desc.CTUD=Kétirányú számláló külön fel- és leszámláló órajellel. IEC 61131-3 szabványos blokk.
block.desc.PID=Arányos-Integráló-Derivatív szabályozási hurok. Gyakori gyártói kiterjesztés (nem része az IEC 61131-3 alapszabványnak, de a PLC-gyártók szinte mindegyike biztosítja).
block.desc.SCALE=Az IN értékét lineárisan átszámítja az [INMIN, INMAX] tartományból az [OUTMIN, OUTMAX] tartományba. Gyakori gyártói kiterjesztés.
block.desc.HYSTERESIS=Két küszöbértékes hiszterézis / be-ki (bang-bang) komparátor on/off szabályozási hurkokhoz. Gyakori gyártói kiterjesztés.

example.logic_basics.title=Logikai alapok
example.logic_basics.description=AND/OR/NOT alapok: egy motor indítási engedélye, ami egy védőajtóval és egy invertált E-Stop-pal van összezárva.
example.blinking_alarm.title=Villogó riasztó (TP)
example.blinking_alarm.description=Egy TP impulzusidőzítő, amely visszacsatolt NOT-on keresztül önmagát indítja újra, 500ms-onta ki-be kapcsolva a BEACON-t, amíg az ALARM_ACTIVE TRUE.
example.conveyor_interlock.title=Szállítószalag indítás/leállítás interlock
example.conveyor_interlock.description=A START_PB beállítja az SR tárolót, a STOP_PB vagy az E_STOP (OR-on keresztül) visszaállítja; a CONVEYOR_RUN követi a tároló állapotát.
example.batch_counter.title=Darabszámláló (CTU)
example.batch_counter.description=A PART_SENSOR impulzusait számolja egy CTU blokkal; a BATCH_FULL TRUE lesz, amint a PART_COUNT eléri a 10-es beállított értéket.
example.tank_hysteresis.title=Tartályszint hiszterézis szabályozás
example.tank_hysteresis.description=A FILL_PUMP_ON a TANK_LEVEL 20% alatt bekapcsol, 80% felett kikapcsol, a HYSTERESIS blokk segítségével elkerülve a szivattyú kapcsolgatását.
example.pid_temperature.title=PID hőmérséklet-szabályozás
example.pid_temperature.description=Egy PID blokk vezérli a HEATER_OUTPUT-ot (0-100%), hogy a TEMP_PV elérje a TEMP_SETPOINT-ot.
example.seatbelt_warning.title=Biztonsági öv figyelmeztető lánc
example.seatbelt_warning.description=A CHIME megszólal, ha az IGNITION_ON 5 másodpercig TRUE marad, miközben a SEATBELT_FASTENED FALSE.
example.two_pump_alternation.title=Két szivattyú váltásos üzeme
example.two_pump_alternation.description=Minden START_CYCLE impulzus léptet egy mod-2 számlálót, így a PUMP1_RUN és a PUMP2_RUN egymást követő ciklusokban váltakozik.
example.debounce_circuit.title=Kapcsoló kontaktfeszítés-szűrő
example.debounce_circuit.description=A RAW_SWITCH-nek 50ms-ig TRUE-nak kell maradnia, mielőtt a DEBOUNCED követi — ez kiszűri a kontaktusok pattogását.
example.parking_garage_counter.title=Parkolóház autószámláló
example.parking_garage_counter.description=A CTUD növekszik a CAR_ENTER-re és csökken a CAR_EXIT-re; a LOT_FULL kigyullad, amint a kapacitás (50) elérésre került.
example.emergency_stop_chain.title=Vészleállító lánc
example.emergency_stop_chain.description=Bármelyik a három E-Stop állomás közül kioldja a reset-domináns RS tárolót; a PLANT_SAFE_TO_RUN csak a RESET_ACK után és minden stop feloldása után tér vissza.
example.star_delta_start.title=Csillag-delta motorindítási szekvencia
example.star_delta_start.description=A START_PB/STOP_PB zárja a MAIN_CONTACTOR-t; a STAR_CONTACTOR 3 másodpercig fut, majd a DELTA_CONTACTOR veszi át.
