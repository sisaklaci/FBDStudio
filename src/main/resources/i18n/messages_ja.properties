pin.forceHint=シミュレーション実行中にクリックすると値を強制／切り替えできます。

block.desc.AND=すべての入力の論理AND。IEC 61131-3 標準ブロック。
block.desc.OR=すべての入力の論理OR。IEC 61131-3 標準ブロック。
block.desc.XOR=すべての入力の論理排他的OR。IEC 61131-3 標準ブロック。
block.desc.NOT=論理否定。IEC 61131-3 標準ブロック。
block.desc.GT=単調減少比較：IN1 > IN2 > ... IEC 61131-3 標準ブロック。
block.desc.GE=IN1 >= IN2 >= ... IEC 61131-3 標準ブロック。
block.desc.EQ=IN1 = IN2 = ... IEC 61131-3 標準ブロック。
block.desc.NE=IN1 <> IN2。IEC 61131-3 標準ブロック。
block.desc.LE=IN1 <= IN2 <= ... IEC 61131-3 標準ブロック。
block.desc.LT=IN1 < IN2 < ... IEC 61131-3 標準ブロック。
block.desc.ADD=すべての入力の合計。IEC 61131-3 標準ブロック。
block.desc.SUB=IN1 - IN2。IEC 61131-3 標準ブロック。
block.desc.MUL=すべての入力の積。IEC 61131-3 標準ブロック。
block.desc.DIV=IN1 / IN2。IEC 61131-3 標準ブロック。
block.desc.MOD=IN1 / IN2 の余り。IEC 61131-3 標準ブロック。
block.desc.MOVE=IN をそのまま Q に渡します。IEC 61131-3 標準ブロック。
block.desc.SEL=二値選択：Q = G ? IN1 : IN0。IEC 61131-3 標準ブロック。
block.desc.MUX=マルチプレクサ：Q = INk（k は 0 始まりのインデックス K）。IEC 61131-3 標準ブロック。
block.desc.LIMIT=IN を MN と MX の間に制限します。IEC 61131-3 標準ブロック。
block.desc.MAX=すべての入力の最大値。IEC 61131-3 標準ブロック。
block.desc.MIN=すべての入力の最小値。IEC 61131-3 標準ブロック。
block.desc.SR=セット優先双安定：S1 と R が共に TRUE のとき、Q1 は TRUE になります。IEC 61131-3 標準ブロック。
block.desc.RS=リセット優先双安定：S と R1 が共に TRUE のとき、Q1 は FALSE になります。IEC 61131-3 標準ブロック。
block.desc.R_TRIG=立ち上がりエッジ検出：CLK が FALSE から TRUE に変化したとき、Q は1スキャンの間 TRUE になります。IEC 61131-3 標準ブロック。
block.desc.F_TRIG=立ち下がりエッジ検出：CLK が TRUE から FALSE に変化したとき、Q は1スキャンの間 TRUE になります。IEC 61131-3 標準ブロック。
block.desc.TON=IN が TRUE になってから PT 後に出力 Q が TRUE になります（IN が FALSE に戻ると即座にリセット）。IEC 61131-3 標準ブロック。
block.desc.TOF=IN が FALSE になった後、出力 Q は PT の間 TRUE を維持します。IEC 61131-3 標準ブロック。
block.desc.TP=IN が TRUE になったとき、PT の固定時間幅の単発パルスを生成します。IEC 61131-3 標準ブロック。
block.desc.CTU=CU の立ち上がりエッジごとに PV まで加算し、CV >= PV になると Q は TRUE になります。IEC 61131-3 標準ブロック。
block.desc.CTD=CD の立ち上がりエッジごとに PV から 0 まで減算し、CV <= 0 になると Q は TRUE になります。IEC 61131-3 標準ブロック。
block.desc.CTUD=加算・減算用の個別クロックを持つ双方向カウンタ。IEC 61131-3 標準ブロック。
block.desc.PID=比例・積分・微分（PID）制御ループ。一般的なベンダー拡張ブロック（IEC 61131-3 のコア標準には含まれませんが、ほぼすべての PLC ベンダーが提供しています）。
block.desc.SCALE=IN を [INMIN, INMAX] の範囲から [OUTMIN, OUTMAX] の範囲へ線形に再スケールします。一般的なベンダー拡張ブロック。
block.desc.HYSTERESIS=オン/オフ制御ループに使われる二閾値ヒステリシス（バンバン）コンパレータ。一般的なベンダー拡張ブロック。

example.logic_basics.title=論理の基本
example.logic_basics.description=AND/OR/NOT の基本：ガードドアと反転したE-Stopでインターロックされたモーター運転許可。
example.blinking_alarm.title=点滅アラーム（TP）
example.blinking_alarm.description=フィードバックNOTを介して自己再トリガーするTPパルスタイマーで、ALARM_ACTIVE が TRUE の間、BEACON を500msごとに点滅させます。
example.conveyor_interlock.title=コンベア始動/停止インターロック
example.conveyor_interlock.description=START_PB が SR ラッチをセットし、STOP_PB または E_STOP（OR経由）がリセットします。CONVEYOR_RUN はラッチの状態に従います。
example.batch_counter.title=バッチカウンタ（CTU）
example.batch_counter.description=CTUブロックで PART_SENSOR のパルスを数え、PART_COUNT が設定値10に達すると BATCH_FULL が TRUE になります。
example.tank_hysteresis.title=タンクレベル・ヒステリシス制御
example.tank_hysteresis.description=HYSTERESISブロックを使い、TANK_LEVEL が20%未満でFILL_PUMP_ONがオン、80%を超えるとオフになり、ポンプのチャタリングを防ぎます。
example.pid_temperature.title=PID温度制御
example.pid_temperature.description=PIDブロックが HEATER_OUTPUT（0〜100%）を制御し、TEMP_PV を TEMP_SETPOINT に近づけます。
example.seatbelt_warning.title=シートベルト警告チェーン
example.seatbelt_warning.description=IGNITION_ON が5秒間 TRUE を維持し、SEATBELT_FASTENED が FALSE のとき、CHIME が鳴ります。
example.two_pump_alternation.title=2台ポンプ交互運転ステーション
example.two_pump_alternation.description=START_CYCLE のパルスごとに mod-2 カウンタが進み、PUMP1_RUN と PUMP2_RUN が連続するサイクルで交互に動作します。
example.debounce_circuit.title=スイッチ・チャタリング除去回路
example.debounce_circuit.description=RAW_SWITCH が50ms間 TRUE を維持してから DEBOUNCED が追従し、接点のチャタリングを除去します。
example.parking_garage_counter.title=立体駐車場の車両カウンタ
example.parking_garage_counter.description=CTUD は CAR_ENTER で増加し、CAR_EXIT で減少します。容量（50台）に達すると LOT_FULL が点灯します。
example.emergency_stop_chain.title=緊急停止チェーン
example.emergency_stop_chain.description=3つの緊急停止ステーションのいずれかがリセット優先のRSラッチを作動させます。PLANT_SAFE_TO_RUN は RESET_ACK 後、すべての停止が解除されてからのみ復帰します。
example.star_delta_start.title=スター・デルタ モーター起動シーケンス
example.star_delta_start.description=START_PB/STOP_PB が MAIN_CONTACTOR をラッチします。STAR_CONTACTOR が3秒間動作した後、DELTA_CONTACTOR に切り替わります。
