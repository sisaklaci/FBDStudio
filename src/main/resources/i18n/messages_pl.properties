block.desc.AND=Logiczne AND wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.OR=Logiczne OR wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.XOR=Logiczne wykluczające OR (XOR) wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.NOT=Negacja logiczna. Standardowy blok IEC 61131-3.
block.desc.GT=Porównanie monotonicznie malejące: IN1 > IN2 > ... Standardowy blok IEC 61131-3.
block.desc.GE=IN1 >= IN2 >= ... Standardowy blok IEC 61131-3.
block.desc.EQ=IN1 = IN2 = ... Standardowy blok IEC 61131-3.
block.desc.NE=IN1 <> IN2. Standardowy blok IEC 61131-3.
block.desc.LE=IN1 <= IN2 <= ... Standardowy blok IEC 61131-3.
block.desc.LT=IN1 < IN2 < ... Standardowy blok IEC 61131-3.
block.desc.ADD=Suma wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.SUB=IN1 - IN2. Standardowy blok IEC 61131-3.
block.desc.MUL=Iloczyn wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.DIV=IN1 / IN2. Standardowy blok IEC 61131-3.
block.desc.MOD=Reszta z dzielenia IN1 / IN2. Standardowy blok IEC 61131-3.
block.desc.MOVE=Przekazuje IN bez zmian na wyjście Q. Standardowy blok IEC 61131-3.
block.desc.SEL=Wybór binarny: Q = G ? IN1 : IN0. Standardowy blok IEC 61131-3.
block.desc.MUX=Multiplekser: Q = INk, gdzie k to indeks K liczony od zera. Standardowy blok IEC 61131-3.
block.desc.LIMIT=Ogranicza IN do zakresu między MN i MX. Standardowy blok IEC 61131-3.
block.desc.MAX=Największa wartość ze wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.MIN=Najmniejsza wartość ze wszystkich wejść. Standardowy blok IEC 61131-3.
block.desc.SR=Przerzutnik z dominującym ustawianiem: jeśli S1 i R są TRUE, Q1 staje się TRUE. Standardowy blok IEC 61131-3.
block.desc.RS=Przerzutnik z dominującym resetem: jeśli S i R1 są TRUE, Q1 staje się FALSE. Standardowy blok IEC 61131-3.
block.desc.R_TRIG=Detektor narastającego zbocza: Q jest TRUE na jeden cykl, gdy CLK zmienia się z FALSE na TRUE. Standardowy blok IEC 61131-3.
block.desc.F_TRIG=Detektor opadającego zbocza: Q jest TRUE na jeden cykl, gdy CLK zmienia się z TRUE na FALSE. Standardowy blok IEC 61131-3.
block.desc.TON=Wyjście Q staje się TRUE po czasie PT od momentu, gdy IN stanie się TRUE (resetuje się natychmiast, gdy IN przejdzie na FALSE). Standardowy blok IEC 61131-3.
block.desc.TOF=Wyjście Q pozostaje TRUE przez czas PT po tym, jak IN stanie się FALSE. Standardowy blok IEC 61131-3.
block.desc.TP=Generuje jeden impuls o ustalonym czasie trwania PT, gdy IN stanie się TRUE. Standardowy blok IEC 61131-3.
block.desc.CTU=Zlicza w górę przy każdym narastającym zboczu CU aż do PV; Q staje się TRUE, gdy CV >= PV. Standardowy blok IEC 61131-3.
block.desc.CTD=Zlicza w dół przy każdym narastającym zboczu CD od PV do 0; Q staje się TRUE, gdy CV <= 0. Standardowy blok IEC 61131-3.
block.desc.CTUD=Licznik dwukierunkowy z osobnymi zegarami zliczania w górę i w dół. Standardowy blok IEC 61131-3.
block.desc.PID=Regulator proporcjonalno-całkująco-różniczkujący (PID). Popularne rozszerzenie producenta (nie jest częścią podstawowego standardu IEC 61131-3, ale dostarczane przez praktycznie wszystkich producentów PLC).
block.desc.SCALE=Liniowo przeskalowuje IN z zakresu [INMIN, INMAX] do zakresu [OUTMIN, OUTMAX]. Popularne rozszerzenie producenta.
block.desc.HYSTERESIS=Komparator histerezy dwuprogowej (bang-bang) używany w regulacji dwustanowej. Popularne rozszerzenie producenta.

example.logic_basics.title=Podstawy logiki
example.logic_basics.description=Podstawy AND/OR/NOT: zgoda na pracę silnika zablokowana drzwiami osłonowymi i zanegowanym E-Stop.
example.blinking_alarm.title=Migający alarm (TP)
example.blinking_alarm.description=Timer impulsowy TP podłączony przez sprzężenie zwrotne NOT, który sam się wyzwala, migając BEACON co 500ms, gdy ALARM_ACTIVE jest TRUE.
example.conveyor_interlock.title=Blokada start/stop przenośnika
example.conveyor_interlock.description=START_PB ustawia przerzutnik SR, STOP_PB lub E_STOP (przez OR) go resetuje; CONVEYOR_RUN odpowiada stanowi przerzutnika.
example.batch_counter.title=Licznik partii (CTU)
example.batch_counter.description=Zlicza impulsy PART_SENSOR za pomocą bloku CTU; BATCH_FULL staje się TRUE, gdy PART_COUNT osiągnie wartość zadaną 10.
example.tank_hysteresis.title=Regulacja histerezowa poziomu zbiornika
example.tank_hysteresis.description=FILL_PUMP_ON włącza się poniżej 20% i wyłącza powyżej 80% TANK_LEVEL, dzięki blokowi HYSTERESIS zapobiegającemu częstym przełączeniom pompy.
example.pid_temperature.title=Regulacja temperatury PID
example.pid_temperature.description=Blok PID steruje HEATER_OUTPUT (0-100%), aby doprowadzić TEMP_PV do TEMP_SETPOINT.
example.seatbelt_warning.title=Łańcuch ostrzegania o pasach bezpieczeństwa
example.seatbelt_warning.description=CHIME włącza się, gdy IGNITION_ON pozostaje TRUE przez 5 sekund, a SEATBELT_FASTENED jest FALSE.
example.two_pump_alternation.title=Stacja alternacji dwóch pomp
example.two_pump_alternation.description=Każdy impuls START_CYCLE zwiększa licznik modulo 2, dzięki czemu PUMP1_RUN i PUMP2_RUN przełączają się w kolejnych cyklach.
example.debounce_circuit.title=Układ eliminacji drgań kontaktu
example.debounce_circuit.description=RAW_SWITCH musi pozostać TRUE przez 50ms, zanim zareaguje DEBOUNCED — eliminuje to drgania kontaktów.
example.parking_garage_counter.title=Licznik samochodów w parkingu
example.parking_garage_counter.description=CTUD zwiększa się przy CAR_ENTER i zmniejsza przy CAR_EXIT; LOT_FULL zapala się po osiągnięciu pojemności (50).
example.emergency_stop_chain.title=Łańcuch zatrzymania awaryjnego
example.emergency_stop_chain.description=Każda z trzech stacji E-Stop wyzwala przerzutnik RS z dominującym resetem; PLANT_SAFE_TO_RUN wraca tylko po RESET_ACK i zwolnieniu wszystkich zatrzymań.
example.star_delta_start.title=Sekwencja rozruchu silnika gwiazda-trójkąt
example.star_delta_start.description=START_PB/STOP_PB blokują MAIN_CONTACTOR; STAR_CONTACTOR pracuje 3s, po czym przejmuje DELTA_CONTACTOR.
