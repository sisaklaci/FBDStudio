block.desc.AND=Logical AND of all inputs. IEC 61131-3 standard block.
block.desc.OR=Logical OR of all inputs. IEC 61131-3 standard block.
block.desc.XOR=Logical exclusive-OR of all inputs. IEC 61131-3 standard block.
block.desc.NOT=Logical negation. IEC 61131-3 standard block.
block.desc.GT=Monotonically decreasing comparison: IN1 > IN2 > ... IEC 61131-3 standard block.
block.desc.GE=IN1 >= IN2 >= ... IEC 61131-3 standard block.
block.desc.EQ=IN1 = IN2 = ... IEC 61131-3 standard block.
block.desc.NE=IN1 <> IN2. IEC 61131-3 standard block.
block.desc.LE=IN1 <= IN2 <= ... IEC 61131-3 standard block.
block.desc.LT=IN1 < IN2 < ... IEC 61131-3 standard block.
block.desc.ADD=Sum of all inputs. IEC 61131-3 standard block.
block.desc.SUB=IN1 - IN2. IEC 61131-3 standard block.
block.desc.MUL=Product of all inputs. IEC 61131-3 standard block.
block.desc.DIV=IN1 / IN2. IEC 61131-3 standard block.
block.desc.MOD=Remainder of IN1 / IN2. IEC 61131-3 standard block.
block.desc.MOVE=Passes IN through to Q unchanged. IEC 61131-3 standard block.
block.desc.SEL=Binary select: Q = G ? IN1 : IN0. IEC 61131-3 standard block.
block.desc.MUX=Multiplexer: Q = INk, where k is the 0-based index K. IEC 61131-3 standard block.
block.desc.LIMIT=Clamps IN between MN and MX. IEC 61131-3 standard block.
block.desc.MAX=Largest of all inputs. IEC 61131-3 standard block.
block.desc.MIN=Smallest of all inputs. IEC 61131-3 standard block.
block.desc.SR=Set-dominant bistable: if S1 and R both TRUE, Q1 becomes TRUE. IEC 61131-3 standard block.
block.desc.RS=Reset-dominant bistable: if S and R1 both TRUE, Q1 becomes FALSE. IEC 61131-3 standard block.
block.desc.R_TRIG=Rising-edge detector: Q is TRUE for one scan when CLK transitions FALSE to TRUE. IEC 61131-3 standard block.
block.desc.F_TRIG=Falling-edge detector: Q is TRUE for one scan when CLK transitions TRUE to FALSE. IEC 61131-3 standard block.
block.desc.TON=Output Q becomes TRUE PT after IN becomes TRUE (resets immediately if IN goes FALSE). IEC 61131-3 standard block.
block.desc.TOF=Output Q stays TRUE for PT after IN becomes FALSE. IEC 61131-3 standard block.
block.desc.TP=Generates a single fixed-duration pulse of length PT when IN becomes TRUE. IEC 61131-3 standard block.
block.desc.CTU=Counts up on each rising edge of CU until reaching PV; Q becomes TRUE when CV >= PV. IEC 61131-3 standard block.
block.desc.CTD=Counts down on each rising edge of CD from PV to 0; Q becomes TRUE when CV <= 0. IEC 61131-3 standard block.
block.desc.CTUD=Bidirectional counter with separate count-up and count-down clocks. IEC 61131-3 standard block.
block.desc.PID=Proportional-Integral-Derivative control loop. Common vendor extension block (not part of the IEC 61131-3 core standard, but near-universally supplied by PLC vendors).
block.desc.SCALE=Linearly rescales IN from range [INMIN, INMAX] to range [OUTMIN, OUTMAX]. Common vendor extension block.
block.desc.HYSTERESIS=Two-threshold hysteresis / bang-bang comparator used for on/off control loops. Common vendor extension block.

example.logic_basics.title=Logic Basics
example.logic_basics.description=AND/OR/NOT fundamentals: a motor run-permit interlocked with a guard door and an inverted E-Stop.
example.blinking_alarm.title=Blinking Alarm (TP)
example.blinking_alarm.description=A TP pulse timer wired through a feedback NOT to retrigger itself, flashing BEACON on/off every 500ms while ALARM_ACTIVE is TRUE.
example.conveyor_interlock.title=Conveyor Start/Stop Interlock
example.conveyor_interlock.description=START_PB sets an SR latch, STOP_PB or E_STOP (via OR) resets it; CONVEYOR_RUN follows the latch.
example.batch_counter.title=Batch Counter (CTU)
example.batch_counter.description=Counts PART_SENSOR pulses with a CTU block; BATCH_FULL goes TRUE once PART_COUNT reaches the preset of 10.
example.tank_hysteresis.title=Tank Level Hysteresis Control
example.tank_hysteresis.description=FILL_PUMP_ON turns on below 20% and off above 80% of TANK_LEVEL, using the HYSTERESIS block to avoid pump chatter.
example.pid_temperature.title=PID Temperature Control
example.pid_temperature.description=A PID block drives HEATER_OUTPUT (0-100%) to bring TEMP_PV to TEMP_SETPOINT.
example.seatbelt_warning.title=Seatbelt Warning Chain
example.seatbelt_warning.description=CHIME sounds if IGNITION_ON stays TRUE for 5 seconds while SEATBELT_FASTENED is FALSE.
example.two_pump_alternation.title=Two-Pump Alternation Station
example.two_pump_alternation.description=Each START_CYCLE pulse advances a mod-2 counter so PUMP1_RUN and PUMP2_RUN alternate across successive cycles.
example.debounce_circuit.title=Switch Debounce Circuit
example.debounce_circuit.description=RAW_SWITCH must stay TRUE for 50ms before DEBOUNCED follows, filtering out contact bounce.
example.parking_garage_counter.title=Parking Garage Car Counter
example.parking_garage_counter.description=CTUD increments on CAR_ENTER and decrements on CAR_EXIT; LOT_FULL lights once capacity (50) is reached.
example.emergency_stop_chain.title=Emergency Stop Chain
example.emergency_stop_chain.description=Any of three E-Stop stations trips a reset-dominant RS latch; PLANT_SAFE_TO_RUN only returns after RESET_ACK and all stops clear.
example.star_delta_start.title=Star-Delta Motor Start Sequence
example.star_delta_start.description=START_PB/STOP_PB latch MAIN_CONTACTOR; STAR_CONTACTOR runs for 3s, then DELTA_CONTACTOR takes over.
