block.desc.AND=所有输入的逻辑“与”。IEC 61131-3 标准块。
block.desc.OR=所有输入的逻辑“或”。IEC 61131-3 标准块。
block.desc.XOR=所有输入的逻辑“异或”。IEC 61131-3 标准块。
block.desc.NOT=逻辑取反。IEC 61131-3 标准块。
block.desc.GT=单调递减比较：IN1 > IN2 > ... IEC 61131-3 标准块。
block.desc.GE=IN1 >= IN2 >= ... IEC 61131-3 标准块。
block.desc.EQ=IN1 = IN2 = ... IEC 61131-3 标准块。
block.desc.NE=IN1 <> IN2。IEC 61131-3 标准块。
block.desc.LE=IN1 <= IN2 <= ... IEC 61131-3 标准块。
block.desc.LT=IN1 < IN2 < ... IEC 61131-3 标准块。
block.desc.ADD=所有输入的总和。IEC 61131-3 标准块。
block.desc.SUB=IN1 - IN2。IEC 61131-3 标准块。
block.desc.MUL=所有输入的乘积。IEC 61131-3 标准块。
block.desc.DIV=IN1 / IN2。IEC 61131-3 标准块。
block.desc.MOD=IN1 / IN2 的余数。IEC 61131-3 标准块。
block.desc.MOVE=将 IN 原样传递到 Q。IEC 61131-3 标准块。
block.desc.SEL=二选一选择：Q = G ? IN1 : IN0。IEC 61131-3 标准块。
block.desc.MUX=多路选择器：Q = INk，其中 k 是从 0 开始的索引 K。IEC 61131-3 标准块。
block.desc.LIMIT=将 IN 限制在 MN 和 MX 之间。IEC 61131-3 标准块。
block.desc.MAX=所有输入中的最大值。IEC 61131-3 标准块。
block.desc.MIN=所有输入中的最小值。IEC 61131-3 标准块。
block.desc.SR=置位优先双稳态：若 S1 和 R 同时为 TRUE，则 Q1 变为 TRUE。IEC 61131-3 标准块。
block.desc.RS=复位优先双稳态：若 S 和 R1 同时为 TRUE，则 Q1 变为 FALSE。IEC 61131-3 标准块。
block.desc.R_TRIG=上升沿检测：当 CLK 从 FALSE 变为 TRUE 时，Q 在一个扫描周期内为 TRUE。IEC 61131-3 标准块。
block.desc.F_TRIG=下降沿检测：当 CLK 从 TRUE 变为 FALSE 时，Q 在一个扫描周期内为 TRUE。IEC 61131-3 标准块。
block.desc.TON=IN 变为 TRUE 经过 PT 时间后，输出 Q 变为 TRUE（IN 变为 FALSE 时立即复位）。IEC 61131-3 标准块。
block.desc.TOF=IN 变为 FALSE 后，输出 Q 保持 TRUE 状态 PT 时间。IEC 61131-3 标准块。
block.desc.TP=当 IN 变为 TRUE 时，产生一个固定时长 PT 的单一脉冲。IEC 61131-3 标准块。
block.desc.CTU=CU 每次上升沿向上计数，直到达到 PV；当 CV >= PV 时 Q 变为 TRUE。IEC 61131-3 标准块。
block.desc.CTD=CD 每次上升沿从 PV 向下计数到 0；当 CV <= 0 时 Q 变为 TRUE。IEC 61131-3 标准块。
block.desc.CTUD=具有独立加计数和减计数时钟的双向计数器。IEC 61131-3 标准块。
block.desc.PID=比例-积分-微分（PID）控制回路。常见的厂商扩展块（不属于 IEC 61131-3 核心标准，但几乎所有 PLC 厂商都提供）。
block.desc.SCALE=将 IN 从 [INMIN, INMAX] 范围线性缩放到 [OUTMIN, OUTMAX] 范围。常见的厂商扩展块。
block.desc.HYSTERESIS=用于开关型控制回路的双阈值滞回（通断）比较器。常见的厂商扩展块。

example.logic_basics.title=逻辑基础
example.logic_basics.description=AND/OR/NOT 基础：电机运行许可与防护门及反转的急停联锁。
example.blinking_alarm.title=闪烁报警（TP）
example.blinking_alarm.description=通过反馈 NOT 自我重新触发的 TP 脉冲定时器，在 ALARM_ACTIVE 为 TRUE 期间每 500 毫秒闪烁 BEACON。
example.conveyor_interlock.title=传送带启动/停止联锁
example.conveyor_interlock.description=START_PB 置位 SR 锁存器，STOP_PB 或 E_STOP（通过 OR）将其复位；CONVEYOR_RUN 跟随锁存器状态。
example.batch_counter.title=批次计数器（CTU）
example.batch_counter.description=使用 CTU 块计数 PART_SENSOR 脉冲；当 PART_COUNT 达到预设值 10 时，BATCH_FULL 变为 TRUE。
example.tank_hysteresis.title=水箱液位滞回控制
example.tank_hysteresis.description=当 TANK_LEVEL 低于 20% 时 FILL_PUMP_ON 开启，高于 80% 时关闭，使用 HYSTERESIS 块避免泵频繁启停。
example.pid_temperature.title=PID 温度控制
example.pid_temperature.description=PID 块驱动 HEATER_OUTPUT（0-100%），使 TEMP_PV 趋近 TEMP_SETPOINT。
example.seatbelt_warning.title=安全带警示链
example.seatbelt_warning.description=当 IGNITION_ON 持续 TRUE 达 5 秒而 SEATBELT_FASTENED 为 FALSE 时，CHIME 响起。
example.two_pump_alternation.title=双泵轮换站
example.two_pump_alternation.description=每次 START_CYCLE 脉冲使模 2 计数器前进一步，使 PUMP1_RUN 和 PUMP2_RUN 在连续周期中交替运行。
example.debounce_circuit.title=开关去抖电路
example.debounce_circuit.description=RAW_SWITCH 必须保持 TRUE 达 50 毫秒后 DEBOUNCED 才跟随变化，从而滤除触点抖动。
example.parking_garage_counter.title=停车场车辆计数器
example.parking_garage_counter.description=CTUD 在 CAR_ENTER 时递增，在 CAR_EXIT 时递减；一旦达到容量（50），LOT_FULL 点亮。
example.emergency_stop_chain.title=紧急停止链
example.emergency_stop_chain.description=三个急停站中任意一个触发复位优先的 RS 锁存器；只有在 RESET_ACK 且所有急停都已解除后，PLANT_SAFE_TO_RUN 才会恢复。
example.star_delta_start.title=星形-三角形电机启动序列
example.star_delta_start.description=START_PB/STOP_PB 锁定 MAIN_CONTACTOR；STAR_CONTACTOR 运行 3 秒后，由 DELTA_CONTACTOR 接管。
