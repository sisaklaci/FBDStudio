block.desc.AND=AND lógica de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.OR=OR lógica de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.XOR=OR exclusiva lógica de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.NOT=Negación lógica. Bloque estándar IEC 61131-3.
block.desc.GT=Comparación monótonamente decreciente: IN1 > IN2 > ... Bloque estándar IEC 61131-3.
block.desc.GE=IN1 >= IN2 >= ... Bloque estándar IEC 61131-3.
block.desc.EQ=IN1 = IN2 = ... Bloque estándar IEC 61131-3.
block.desc.NE=IN1 <> IN2. Bloque estándar IEC 61131-3.
block.desc.LE=IN1 <= IN2 <= ... Bloque estándar IEC 61131-3.
block.desc.LT=IN1 < IN2 < ... Bloque estándar IEC 61131-3.
block.desc.ADD=Suma de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.SUB=IN1 - IN2. Bloque estándar IEC 61131-3.
block.desc.MUL=Producto de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.DIV=IN1 / IN2. Bloque estándar IEC 61131-3.
block.desc.MOD=Resto de IN1 / IN2. Bloque estándar IEC 61131-3.
block.desc.MOVE=Pasa IN a Q sin cambios. Bloque estándar IEC 61131-3.
block.desc.SEL=Selección binaria: Q = G ? IN1 : IN0. Bloque estándar IEC 61131-3.
block.desc.MUX=Multiplexor: Q = INk, donde k es el índice K de base 0. Bloque estándar IEC 61131-3.
block.desc.LIMIT=Limita IN entre MN y MX. Bloque estándar IEC 61131-3.
block.desc.MAX=El mayor de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.MIN=El menor de todas las entradas. Bloque estándar IEC 61131-3.
block.desc.SR=Biestable dominante de set: si S1 y R son ambos TRUE, Q1 pasa a TRUE. Bloque estándar IEC 61131-3.
block.desc.RS=Biestable dominante de reset: si S y R1 son ambos TRUE, Q1 pasa a FALSE. Bloque estándar IEC 61131-3.
block.desc.R_TRIG=Detector de flanco ascendente: Q es TRUE durante un ciclo cuando CLK pasa de FALSE a TRUE. Bloque estándar IEC 61131-3.
block.desc.F_TRIG=Detector de flanco descendente: Q es TRUE durante un ciclo cuando CLK pasa de TRUE a FALSE. Bloque estándar IEC 61131-3.
block.desc.TON=La salida Q pasa a TRUE PT después de que IN se vuelve TRUE (se reinicia inmediatamente si IN pasa a FALSE). Bloque estándar IEC 61131-3.
block.desc.TOF=La salida Q permanece TRUE durante PT después de que IN pasa a FALSE. Bloque estándar IEC 61131-3.
block.desc.TP=Genera un único pulso de duración fija PT cuando IN se vuelve TRUE. Bloque estándar IEC 61131-3.
block.desc.CTU=Cuenta hacia arriba en cada flanco ascendente de CU hasta alcanzar PV; Q pasa a TRUE cuando CV >= PV. Bloque estándar IEC 61131-3.
block.desc.CTD=Cuenta hacia abajo en cada flanco ascendente de CD desde PV hasta 0; Q pasa a TRUE cuando CV <= 0. Bloque estándar IEC 61131-3.
block.desc.CTUD=Contador bidireccional con relojes separados de conteo ascendente y descendente. Bloque estándar IEC 61131-3.
block.desc.PID=Lazo de control Proporcional-Integral-Derivativo. Extensión común de fabricante (no forma parte del núcleo del estándar IEC 61131-3, pero la ofrecen casi todos los fabricantes de PLC).
block.desc.SCALE=Reescala linealmente IN del rango [INMIN, INMAX] al rango [OUTMIN, OUTMAX]. Extensión común de fabricante.
block.desc.HYSTERESIS=Comparador de histéresis de dos umbrales (todo/nada) usado en lazos de control on/off. Extensión común de fabricante.

example.logic_basics.title=Fundamentos de lógica
example.logic_basics.description=Fundamentos de AND/OR/NOT: un permiso de marcha de motor enclavado con una puerta de protección y un E-Stop invertido.
example.blinking_alarm.title=Alarma intermitente (TP)
example.blinking_alarm.description=Un temporizador de pulso TP conectado mediante un NOT de realimentación que se reactiva a sí mismo, parpadeando BEACON cada 500ms mientras ALARM_ACTIVE es TRUE.
example.conveyor_interlock.title=Enclavamiento de arranque/paro de cinta transportadora
example.conveyor_interlock.description=START_PB activa un biestable SR, STOP_PB o E_STOP (mediante OR) lo reinicia; CONVEYOR_RUN sigue el estado del biestable.
example.batch_counter.title=Contador de lotes (CTU)
example.batch_counter.description=Cuenta los pulsos de PART_SENSOR con un bloque CTU; BATCH_FULL pasa a TRUE cuando PART_COUNT alcanza el valor preestablecido de 10.
example.tank_hysteresis.title=Control de histéresis de nivel de tanque
example.tank_hysteresis.description=FILL_PUMP_ON se activa por debajo del 20% y se desactiva por encima del 80% de TANK_LEVEL, usando el bloque HYSTERESIS para evitar el traqueteo de la bomba.
example.pid_temperature.title=Control de temperatura PID
example.pid_temperature.description=Un bloque PID controla HEATER_OUTPUT (0-100%) para llevar TEMP_PV a TEMP_SETPOINT.
example.seatbelt_warning.title=Cadena de aviso de cinturón de seguridad
example.seatbelt_warning.description=CHIME suena si IGNITION_ON permanece TRUE durante 5 segundos mientras SEATBELT_FASTENED es FALSE.
example.two_pump_alternation.title=Estación de alternancia de dos bombas
example.two_pump_alternation.description=Cada pulso de START_CYCLE avanza un contador módulo 2, de modo que PUMP1_RUN y PUMP2_RUN alternan en ciclos sucesivos.
example.debounce_circuit.title=Circuito antirrebote de interruptor
example.debounce_circuit.description=RAW_SWITCH debe permanecer TRUE durante 50ms antes de que DEBOUNCED lo siga, filtrando el rebote de contactos.
example.parking_garage_counter.title=Contador de coches de aparcamiento
example.parking_garage_counter.description=CTUD se incrementa con CAR_ENTER y decrementa con CAR_EXIT; LOT_FULL se enciende al alcanzar la capacidad (50).
example.emergency_stop_chain.title=Cadena de parada de emergencia
example.emergency_stop_chain.description=Cualquiera de las tres estaciones de E-Stop activa un biestable RS dominante de reset; PLANT_SAFE_TO_RUN solo vuelve tras RESET_ACK y con todas las paradas liberadas.
example.star_delta_start.title=Secuencia de arranque de motor estrella-triángulo
example.star_delta_start.description=START_PB/STOP_PB enclavan MAIN_CONTACTOR; STAR_CONTACTOR funciona durante 3s y luego lo toma DELTA_CONTACTOR.
