block.desc.AND=ET logique de toutes les entrées. Bloc standard IEC 61131-3.
block.desc.OR=OU logique de toutes les entrées. Bloc standard IEC 61131-3.
block.desc.XOR=OU exclusif logique de toutes les entrées. Bloc standard IEC 61131-3.
block.desc.NOT=Négation logique. Bloc standard IEC 61131-3.
block.desc.GT=Comparaison strictement décroissante : IN1 > IN2 > ... Bloc standard IEC 61131-3.
block.desc.GE=IN1 >= IN2 >= ... Bloc standard IEC 61131-3.
block.desc.EQ=IN1 = IN2 = ... Bloc standard IEC 61131-3.
block.desc.NE=IN1 <> IN2. Bloc standard IEC 61131-3.
block.desc.LE=IN1 <= IN2 <= ... Bloc standard IEC 61131-3.
block.desc.LT=IN1 < IN2 < ... Bloc standard IEC 61131-3.
block.desc.ADD=Somme de toutes les entrées. Bloc standard IEC 61131-3.
block.desc.SUB=IN1 - IN2. Bloc standard IEC 61131-3.
block.desc.MUL=Produit de toutes les entrées. Bloc standard IEC 61131-3.
block.desc.DIV=IN1 / IN2. Bloc standard IEC 61131-3.
block.desc.MOD=Reste de IN1 / IN2. Bloc standard IEC 61131-3.
block.desc.MOVE=Transmet IN à Q sans modification. Bloc standard IEC 61131-3.
block.desc.SEL=Sélection binaire : Q = G ? IN1 : IN0. Bloc standard IEC 61131-3.
block.desc.MUX=Multiplexeur : Q = INk, où k est l'index K basé sur 0. Bloc standard IEC 61131-3.
block.desc.LIMIT=Limite IN entre MN et MX. Bloc standard IEC 61131-3.
block.desc.MAX=La plus grande valeur parmi toutes les entrées. Bloc standard IEC 61131-3.
block.desc.MIN=La plus petite valeur parmi toutes les entrées. Bloc standard IEC 61131-3.
block.desc.SR=Bistable à dominance de mise à 1 : si S1 et R sont tous deux TRUE, Q1 devient TRUE. Bloc standard IEC 61131-3.
block.desc.RS=Bistable à dominance de remise à 0 : si S et R1 sont tous deux TRUE, Q1 devient FALSE. Bloc standard IEC 61131-3.
block.desc.R_TRIG=Détecteur de front montant : Q est TRUE pendant un cycle lorsque CLK passe de FALSE à TRUE. Bloc standard IEC 61131-3.
block.desc.F_TRIG=Détecteur de front descendant : Q est TRUE pendant un cycle lorsque CLK passe de TRUE à FALSE. Bloc standard IEC 61131-3.
block.desc.TON=La sortie Q devient TRUE PT après que IN devient TRUE (se réinitialise immédiatement si IN repasse à FALSE). Bloc standard IEC 61131-3.
block.desc.TOF=La sortie Q reste TRUE pendant PT après que IN passe à FALSE. Bloc standard IEC 61131-3.
block.desc.TP=Génère une seule impulsion de durée fixe PT lorsque IN devient TRUE. Bloc standard IEC 61131-3.
block.desc.CTU=Compte vers le haut à chaque front montant de CU jusqu'à atteindre PV ; Q devient TRUE quand CV >= PV. Bloc standard IEC 61131-3.
block.desc.CTD=Compte vers le bas à chaque front montant de CD depuis PV jusqu'à 0 ; Q devient TRUE quand CV <= 0. Bloc standard IEC 61131-3.
block.desc.CTUD=Compteur bidirectionnel avec horloges séparées de comptage et décomptage. Bloc standard IEC 61131-3.
block.desc.PID=Boucle de régulation Proportionnelle-Intégrale-Dérivée. Extension courante des fabricants (ne fait pas partie du cœur de la norme IEC 61131-3, mais fournie par presque tous les fabricants d'automates).
block.desc.SCALE=Remet IN à l'échelle linéairement de la plage [INMIN, INMAX] vers la plage [OUTMIN, OUTMAX]. Extension courante des fabricants.
block.desc.HYSTERESIS=Comparateur à hystérésis à deux seuils (tout ou rien) utilisé pour les boucles de régulation marche/arrêt. Extension courante des fabricants.

example.logic_basics.title=Bases de la logique
example.logic_basics.description=Bases AND/OR/NOT : une autorisation de marche moteur verrouillée par une porte de protection et un arrêt d'urgence inversé.
example.blinking_alarm.title=Alarme clignotante (TP)
example.blinking_alarm.description=Un temporisateur d'impulsion TP relié via un NOT de rétroaction qui se redéclenche lui-même, faisant clignoter BEACON toutes les 500ms tant que ALARM_ACTIVE est TRUE.
example.conveyor_interlock.title=Verrouillage marche/arrêt de convoyeur
example.conveyor_interlock.description=START_PB active un bistable SR, STOP_PB ou E_STOP (via un OU) le réinitialise ; CONVEYOR_RUN suit l'état du bistable.
example.batch_counter.title=Compteur de lots (CTU)
example.batch_counter.description=Compte les impulsions de PART_SENSOR avec un bloc CTU ; BATCH_FULL devient TRUE dès que PART_COUNT atteint la valeur préréglée de 10.
example.tank_hysteresis.title=Régulation par hystérésis du niveau de cuve
example.tank_hysteresis.description=FILL_PUMP_ON s'active sous 20% et se désactive au-dessus de 80% de TANK_LEVEL, via le bloc HYSTERESIS pour éviter le battement de la pompe.
example.pid_temperature.title=Régulation de température PID
example.pid_temperature.description=Un bloc PID pilote HEATER_OUTPUT (0-100%) pour amener TEMP_PV à TEMP_SETPOINT.
example.seatbelt_warning.title=Chaîne d'alerte de ceinture de sécurité
example.seatbelt_warning.description=CHIME sonne si IGNITION_ON reste TRUE pendant 5 secondes alors que SEATBELT_FASTENED est FALSE.
example.two_pump_alternation.title=Station d'alternance de deux pompes
example.two_pump_alternation.description=Chaque impulsion START_CYCLE fait avancer un compteur modulo 2, si bien que PUMP1_RUN et PUMP2_RUN alternent à chaque cycle.
example.debounce_circuit.title=Circuit anti-rebond d'interrupteur
example.debounce_circuit.description=RAW_SWITCH doit rester TRUE pendant 50ms avant que DEBOUNCED ne suive, filtrant ainsi le rebond des contacts.
example.parking_garage_counter.title=Compteur de voitures de parking
example.parking_garage_counter.description=CTUD s'incrémente sur CAR_ENTER et se décrémente sur CAR_EXIT ; LOT_FULL s'allume une fois la capacité (50) atteinte.
example.emergency_stop_chain.title=Chaîne d'arrêt d'urgence
example.emergency_stop_chain.description=Chacune des trois stations d'arrêt d'urgence déclenche un bistable RS à dominance de remise à 0 ; PLANT_SAFE_TO_RUN ne revient qu'après RESET_ACK et la libération de tous les arrêts.
example.star_delta_start.title=Séquence de démarrage moteur étoile-triangle
example.star_delta_start.description=START_PB/STOP_PB verrouillent MAIN_CONTACTOR ; STAR_CONTACTOR fonctionne pendant 3s, puis DELTA_CONTACTOR prend le relais.
